ame: Test and Deploy

# Runs the Playwright validation suite on every push/PR.
# Deploys to GitHub Pages ONLY when the tests pass on the main branch — so a regression can never reach the live site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy job needs to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Validate model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Reproducible install from the committed package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium) + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test                 # <-- gate: deploy only runs if `test` succeeded
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # This is a USER site (n-nachiappan.github.io) served at the domain root, so the published artifact BECOMES the
      # whole site. Publish the entire repo (preserving any other pages/assets you keep here) EXCEPT the dev/test
      # tooling — so https://n-nachiappan.github.io/retirement_model.html updates in place and nothing else is lost.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='/_site' \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/node_modules' \
            --exclude='/tests' \
            --exclude='/scripts' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/playwright.config.js' \
            --exclude='/playwright-report' \
            --exclude='/test-results' \
            --exclude='/.gitignore' \
            --exclude='/README.md' \
            --exclude='/DEPLOY_SETUP.md'
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
